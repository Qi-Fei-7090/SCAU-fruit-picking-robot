DWAPlannerROS:
  acc_lim_x: 1.0
  acc_lim_y: 0
  acc_lim_th: 0.5
  
  max_vel_trans: 1.6
  min_vel_trans: 0.05
  max_vel_x: 1.5
  min_vel_x: 0.05
  max_vel_y: 0
  min_vel_y: 0
  max_vel_theta: 1.2
  min_vel_theta: 0.05

  yaw_goal_tolerance: 0.15
  xy_goal_tolerance: 0.1
  latch_xy_goal_tolerance: true

  sim_time: 3
  sim_granularity: 0.025
  vx_samples: 10
  vy_samples: 2
  vth_samples: 20
  controller_frequency: 20.0

  path_distance_bias: 32.0
  goal_distance_bias: 24.0
  occdist_scale: 0.3
  forward_point_distance: 0.325
  stop_time_buffer: 0.2
  scaling_speed: 0.25
  max_scaling_factor: 0.2
  
  # publish_cost_grid: true     # wiki error, unused
  publish_traj_pc: true
  publish_cost_grid_pc: true 

  oscillation_reset_dist: 0.05
  prune_plan: true


