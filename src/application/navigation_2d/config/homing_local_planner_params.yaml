HomingLocalPlanner:
  odom_topic: odom

  # Trajectory

  max_global_plan_lookahead_dist: 4.0
  global_plan_viapoint_sep: 1.0
  global_plan_prune_distance: 1.5
  global_plan_goal_sep: 1.5

  # Robot

  max_vel_x: 0.5
  max_vel_x_backwards: 0.1
  max_vel_theta: 0.5
  acc_lim_x: 1.0
  acc_lim_theta: 1.0
  turn_around_priority: True
  stop_dist: 0.60
  dec_dist: 1.0
  

  # GoalTolerance

  xy_goal_tolerance: 0.1
  yaw_goal_tolerance: 0.1

  # Optimization

  k_rho: 5.0
  k_alpha: -3.0
  k_phi: -3.0