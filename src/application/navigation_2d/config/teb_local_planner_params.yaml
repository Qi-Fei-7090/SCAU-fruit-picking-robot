# TebLocalPlannerROS参数

# 里程计话题
odom_topic: odom  # 里程计数据的ROS话题
# 地图坐标系
map_frame: /map  # 地图的坐标系

# 轨迹参数
teb_autosize: True  # 是否自动调整轨迹大小
dt_ref: 0.45  # 参考时间间隔
dt_hysteresis: 0.1  # 时间滞后
global_plan_overwrite_orientation: True  # 是否覆盖全局规划的方向
max_global_plan_lookahead_dist: 2.5  #5# 全局规划的最大前瞻距离
feasibility_check_no_poses: 5  # 可行性检查的姿态数量

# 机器人参数
max_vel_x: 0.3  #0.3 最大线速度
max_vel_x_backwards: 0.15 # 最大后退线速度
max_vel_y: 0
max_vel_theta: 0.4  #0.35 最大角速度
acc_lim_x: 0.15  #0.15 线加速度限制
acc_lim_y: 0
acc_lim_theta: 0.25  #0.35 角加速度限制
min_turning_radius: 0.0  # 最小转弯半径
wheelbase: 0.0
cmd_angle_instead_rotvel: False
footprint_model:  # 机器人外形模型
  type: "polygon"
  #vertices: [[-0.45, -0.37],[-0.45,0.37],[0.45,0.37],[0.45,-0.37]]
  vertices:  [[-0.315, -0.2975], [-0.315, 0.2975], [0.315, 0.2975], [0.315, -0.2975]]    # 长1.255 宽 0.7488
# kinematics:
#   type: "diff_drive"
#   min_turning_radius: 0.0  # 最小转弯半径 (m), 0 表示可以原地转弯

# 目标容差
xy_goal_tolerance: 0.1  # 纵横坐标的目标容差
yaw_goal_tolerance: 0.05  # 偏航角的目标容差
free_goal_vel: False  # 是否允许自由目标速度

# 障碍物参数
min_obstacle_dist: 0.1  # 障碍物最小距离
inflation_dist: 0.15  # 充气距离
include_costmap_obstacles: True  # 是否包括代价地图障碍物
costmap_obstacles_behind_robot_dist: 0.1  # 机器人背后的代价地图障碍物距离
obstacle_poses_affected: 30  # 影响的障碍物姿态数量
costmap_converter_plugin: ""  # 代价地图转换插件
costmap_converter_spin_thread: True  # 是否使用线程进行代价地图转换
costmap_converter_rate: 5  # 代价地图转换的频率

# 优化参数
no_inner_iterations: 5  # 内部迭代次数
no_outer_iterations: 4  # 外部迭代次数
optimization_activate: True  # 是否激活优化
optimization_verbose: False  # 优化详细信息输出
penalty_epsilon: 0.1  # 惩罚因子
weight_max_vel_x: 2  # 最大线速度权重
weight_max_vel_theta: 1  # 最大角速度权重
weight_acc_lim_x: 1  # 线加速度权重
weight_acc_lim_theta: 0.5  # 角加速度权重
weight_kinematics_nh: 1000  # 非完整约束权重
weight_kinematics_forward_drive: 1000  # 前向驾驶权重
weight_kinematics_turning_radius: 1  # 转弯半径权重
weight_optimaltime: 5  # 最优时间权重
weight_obstacle: 150  # 障碍物权重
weight_inflation: 0.2  # 充气权重
weight_dynamic_obstacle: 10  # 动态障碍物权重
selection_alternative_time_cost: False  # 是否使用替代时间代价

# 同伦类规划器
enable_homotopy_class_planning: False  # 是否启用同伦类规划
enable_multithreading: True  # 是否启用多线程
simple_exploration: False  # 是否进行简单探索
max_number_classes: 2  # 最大同伦类数量
roadmap_graph_no_samples: 3  # 路标图样本数量
roadmap_graph_area_width: 5  # 路标图区域宽度
h_signature_prescaler: 0.5  # H签名缩放器
h_signature_threshold: 0.1  # H签名阈值
obstacle_keypoint_offset: 0.1  # 障碍物关键点偏移
obstacle_heading_threshold: 0.45  # 障碍物朝向阈值
visualize_hc_graph: True  # 是否可视化同伦类图
